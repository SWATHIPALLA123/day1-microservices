# ===============================
# Application Configuration
# ===============================

spring.application.name=ORDER-SERVICE
server.port=8082

# ===============================
# Spring Boot Actuator
# ===============================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===============================
# Eureka Server Configuration
# ===============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register with Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ===============================
# User Service Configuration
# ===============================

user-service.base-url=http://localhost:8081


# ===============================
# Resilience4j Logging
# ===============================

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.circuitbreaker.internal=DEBUG


# ===============================
# Resilience4j Retry Configuration
# ===============================

# Total number of attempts including the first attempt
resilience4j.retry.instances.userService.max-attempts=3

# Wait time between retry attempts
resilience4j.retry.instances.userService.wait-duration=2s


# ===============================
# Resilience4j Circuit Breaker Configuration
# ===============================

# Number of calls used to calculate the failure rate
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10

# Minimum number of calls required before calculating failure rate
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=5

# Circuit opens when failure rate reaches 50%
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50

# Time Circuit Breaker remains OPEN
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s

# Number of test calls allowed in HALF_OPEN state
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=2

# Automatically move from OPEN to HALF_OPEN
resilience4j.circuitbreaker.instances.userService.automaticTransitionFromOpenToHalfOpenEnabled=true


# ===============================
# Resilience4j Time Limiter Configuration
# ===============================

# Maximum time allowed for the User Service call
resilience4j.timelimiter.instances.userService.timeout-duration=10s

# Cancel the running operation when timeout occurs
resilience4j.timelimiter.instances.userService.cancel-running-future=true


# ===============================
# Resilience4j Rate Limiter Configuration
# ===============================

# Maximum number of requests allowed in one period
resilience4j.ratelimiter.instances.userService.limit-for-period=5

# Time period after which the limit refreshes
resilience4j.ratelimiter.instances.userService.limit-refresh-period=10s

# Maximum time a request waits for permission
resilience4j.ratelimiter.instances.userService.timeout-duration=0s


# ===============================
# Resilience4j Bulkhead Configuration
# ===============================

# Maximum number of concurrent calls allowed
resilience4j.bulkhead.instances.userService.max-concurrent-calls=5

# Maximum time to wait for an available Bulkhead slot
resilience4j.bulkhead.instances.userService.max-wait-duration=0s